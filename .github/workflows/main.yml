name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes do Android
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK de teste
        working-directory: JARVIS
        run: gradle assembleDebug --stacktrace

      - name: Disponibilizar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: JARVIS/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
